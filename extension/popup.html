<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NimGet</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <main>
    <h1>NimGet</h1>
    <div role="status">
      <p id="status"></p>
      <p id="details"></p>
    </div>
    <div id="confirmation" hidden>
      <p id="request-id"></p>
      <p id="code-label"></p>
      <output id="code" aria-labelledby="code-label"></output>
    </div>
    <button type="button" id="pair" hidden></button>
  </main>
</body>
</html>
