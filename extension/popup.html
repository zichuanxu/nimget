<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NimGet</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
  <script type="module" src="capture-popup.js"></script>
</head>
<body>
  <main>
    <h1>NimGet</h1>
    <div role="status">
      <p id="status"></p>
      <p id="details"></p>
    </div>
    <div id="confirmation" hidden>
      <p id="request-id"></p>
      <p id="code-label"></p>
      <output id="code" aria-labelledby="code-label"></output>
    </div>
    <button type="button" id="pair" hidden></button>
    <button type="button" id="open-desktop" hidden></button>
    <p id="handoff-result" class="handoff-result" role="status"></p>
    <ul id="handoff-retries" hidden></ul>
    <details id="capture-settings-panel">
      <summary id="capture-settings-title"></summary>
      <form id="capture-settings" aria-labelledby="capture-settings-title">
        <p class="capture-check">
          <input type="checkbox" id="capture-enabled" name="enabled" aria-describedby="capture-help">
          <label id="capture-enabled-label" for="capture-enabled"></label>
        </p>
        <p id="capture-help" class="capture-help"></p>
        <label id="capture-sites-label" for="capture-sites"></label>
        <p id="capture-sites-help" class="capture-help"></p>
        <textarea id="capture-sites" name="sites" rows="2" maxlength="2048" spellcheck="false" autocapitalize="none" aria-describedby="capture-sites-help"></textarea>
        <label id="capture-types-label" for="capture-types"></label>
        <p id="capture-types-help" class="capture-help"></p>
        <textarea id="capture-types" name="types" rows="2" maxlength="1024" spellcheck="false" autocapitalize="none" aria-describedby="capture-types-help"></textarea>
        <button id="capture-save" type="submit" disabled></button>
        <p id="capture-settings-result" class="handoff-result" role="status"></p>
      </form>
    </details>
    <p id="capture-result" class="handoff-result" role="status"></p>
  </main>
</body>
</html>
