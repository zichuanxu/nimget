name: Prepare Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.2.3 or v1.2.3-rc.1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      NIMGET_RELEASE_VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check release ref
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $env:NIMGET_RELEASE_VERSION) {
            throw 'The requested version must match the selected tag.'
          }

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: |
            go.sum
            app/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Vet, test, and build the core
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go vet ./...
          go test -race ./...
          go build ./cmd/nimget

      - name: Test the browser extension
        run: node --test tests/extension/*.test.mjs

      - name: Audit frontend dependencies
        working-directory: app/frontend
        run: npm audit --registry=https://registry.npmjs.org

      - name: Install verified NSIS 3.13
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $setup = Join-Path $env:RUNNER_TEMP 'nsis-3.13-setup.exe'
          $nsis = Join-Path $env:RUNNER_TEMP 'nsis-3.13'
          $uri = 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13-setup.exe?use_mirror=pilotfiber'
          curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --output $setup $uri
          # NSIS.NSIS 3.13 in Microsoft's WinGet package manifests.
          $expected = 'DB9A1038BBC0E53FEF24F423FD609979BD578E942F1BE1198DB186D1C42652A3'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash -cne $expected) {
            throw 'Unexpected NSIS download checksum.'
          }
          $installer = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$nsis" -Wait -PassThru -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) { throw "NSIS installation failed: $($installer.ExitCode)" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nsis -Encoding utf8

      - name: Build and verify the release bundle twice
        run: ./scripts/test-windows-release.ps1 -Version $env:NIMGET_RELEASE_VERSION -OutputDirectory dist/release

      - name: Vet and test the production desktop module
        working-directory: app
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go vet -tags production ./...
          go test -tags production ./...

      - name: Test the desktop frontend in Edge
        working-directory: app/frontend
        env:
          NIMGET_TEST_BROWSER: msedge
          NIMGET_TEST_PREVIEW: '1'
        run: npm test

      - name: Verify the assets for upload
        run: ./scripts/prepare-windows-release.ps1 -Version $env:NIMGET_RELEASE_VERSION -VerifyOnly

      - name: Upload only the verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: NimGet-${{ env.NIMGET_RELEASE_VERSION }}-release-assets
          path: dist/release/${{ env.NIMGET_RELEASE_VERSION }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
